name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision roles and schemas
        run: |
          # Wait for postgres to be ready (services healthcheck already, but be explicit)
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
          # Apply every init script in the same order docker-entrypoint-initdb.d
          # would (alphabetical), so CI's live-service Postgres matches what the
          # disposable docker-compose database gets on first boot.
          for f in docker/init/*.sql; do
            psql "postgres://postgres:postgres@localhost:5432/mcp_test" -f "$f"
          done
        env:
          PGPASSWORD: postgres

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcp_test
          DATABASE_URL_READONLY: postgres://readonly:readonly_password@localhost:5432/mcp_test
          DATABASE_URL_WRITER: postgres://writer:writer_password@localhost:5432/mcp_test

      - name: Docker compose smoke test
        run: |
          docker compose config
          # Services postgres already occupies host 5432; compose up would conflict on port binding.
          # Validate config and init script statically when port is busy, otherwise do a real up/down.
          if ss -ltn 2>/dev/null | grep -q ':5432' || netstat -ltn 2>/dev/null | grep -q ':5432' || lsof -i :5432 >/dev/null 2>&1; then
            echo "Port 5432 in use by services container — skipping compose up (config already validated)"
            test -f docker/init/01-roles.sql
            # Validate init SQL parses against live DB (proves role-provisioning SQL is valid)
            psql "postgres://postgres:postgres@localhost:5432/mcp_test" -c "SELECT 1" >/dev/null
          else
            docker compose up -d --wait
            psql "postgres://postgres:postgres@localhost:5432/mcp_test" -c "SELECT current_user"
            docker compose down
          fi
